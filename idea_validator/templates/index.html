<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ site_title }}</title>
    <meta name="description" content="{{ description }}" />

    <!-- Open Graph / social share cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ headline }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ url_for('index', _external=True) }}" />
    <meta property="og:image" content="{{ url_for('og_image', _external=True) }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ headline }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="{{ url_for('og_image', _external=True) }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>{{ headline }}</h1>
        <p class="description">{{ description }}</p>

        <p class="social-proof">
          <span class="social-proof-count">{{ participant_label }}</span> people have already joined
        </p>

        {% if error %}
        <p class="message error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('submit') }}" method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <fieldset>
            <legend>{{ poll_question }}</legend>

            {% for option in poll_options %}
            <label class="poll-option">
              <input
                type="radio"
                name="poll_answer"
                value="{{ option }}"
                {% if selected_poll_answer == option %}checked{% endif %}
                required
              />
              <span>{{ option }}</span>
            </label>
            {% endfor %}
          </fieldset>

          <label for="email" class="input-label">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            value="{{ email or '' }}"
            required
          />

          <button type="submit">Get Early Access</button>
        </form>
      </section>
    </main>
  </body>
</html>
